<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서버 매니저</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 화면 구성: 상단 바 / 로그인 폼 / 대시보드(요약·타일·서비스 표) / 로그 창 / 툴팁.
       내용은 app.js 가 채운다. 로그인 여부에 따라 login 과 dash 중 하나만 보인다(hidden 속성). -->
  <header class="top">
    <h1>서버 매니저</h1>
    <span id="host" class="host"></span>
    <span class="spacer"></span>
    <span id="updated" class="updated" aria-live="off"></span>
    <button id="logout" class="btn" type="button" hidden>로그아웃</button>
  </header>

  <main>
    <section id="login" class="login" hidden>
      <form id="login-form" class="card">
        <h2>로그인</h2>
        <label for="pw">비밀번호</label>
        <input id="pw" type="password" autocomplete="current-password" required autofocus>
        <button class="btn primary" type="submit">로그인</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="dash" hidden>
      <p id="demo-banner" class="banner" hidden>데모 모드 — 화면에 보이는 값은 가짜 데이터입니다.</p>
      <!-- 서비스 상태 개수 요약. aria-live: 상태가 바뀌면 스크린리더가 읽어준다 -->
      <p id="summary" class="summary" aria-live="polite"></p>
      <!-- 서버 전체 타일(CPU/메모리/디스크/가동 시간) -->
      <div id="tiles" class="tiles"></div>

      <h2 class="section">서비스</h2>
      <div class="card table-wrap">
        <table id="services">
          <thead>
            <tr>
              <th scope="col">상태</th>
              <th scope="col">서비스</th>
              <th scope="col" class="num">메모리</th>
              <th scope="col" class="num hide-sm">CPU</th>
              <th scope="col" class="num hide-sm">가동</th>
              <th scope="col" class="num hide-sm">재시작</th>
              <th scope="col">점검</th>
              <th scope="col"><span class="sr-only">작업</span></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <h2 class="section">최근 기록 <small id="events-note" class="muted"></small></h2>
      <div class="card table-wrap">
        <table id="events">
          <thead>
            <tr>
              <th scope="col">시각</th>
              <th scope="col">구분</th>
              <th scope="col">내용</th>
              <th scope="col">접속 IP</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="foot">값은 서버에서 <span id="interval"></span>마다 수집합니다. 차트와 최근 기록은 서버 재시작 시 초기화됩니다(차트는 최근 1시간).</p>
    </section>
  </main>

  <!-- 로그 보기 창: 서비스 행의 [로그] 버튼이 연다. 로그는 <pre> 안에 텍스트로만 넣는다. -->
  <dialog id="log-dialog" class="log-dialog">
    <div class="log-head">
      <strong id="log-title"></strong>
      <span id="log-source" class="muted"></span>
      <span class="spacer"></span>
      <label class="check"><input id="log-auto" type="checkbox" checked> 자동 갱신</label>
      <button id="log-refresh" class="btn" type="button">새로고침</button>
      <button id="log-close" class="btn" type="button">닫기</button>
    </div>
    <p id="log-error" class="error" role="alert"></p>
    <pre id="log-body" class="log-body" tabindex="0"></pre>
  </dialog>

  <!-- 시작/중지/재시작 확인 창. form method="dialog": 누른 버튼의 value("ok"/"cancel")가 닫힐 때 returnValue 가 된다. -->
  <dialog id="confirm-dialog" class="confirm-dialog">
    <form method="dialog">
      <p id="confirm-msg" class="confirm-msg"></p>
      <p id="confirm-warn" class="muted"></p>
      <div class="confirm-actions">
        <button class="btn" value="cancel">취소</button>
        <button id="confirm-ok" class="btn primary" value="ok">확인</button>
      </div>
    </form>
  </dialog>

  <!-- 동작 결과 알림(진행 중/성공/실패). 스크린리더가 읽도록 role="status" -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- 차트에 마우스를 올렸을 때 값을 보여주는 공용 툴팁 -->
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
